
name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            -o /dev/null \
            -w "Supabase HTTP Status: %{http_code}\n" \
            "https://xvtbmxtstejldgsjzdft.supabase.co/rest/v1/bank_accounts?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"

name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            -o /dev/null \
            -w "Supabase HTTP Status: %{http_code}\n" \
            "https://xvtbmxtstejldgsjzdft.supabase.co/rest/v1/bank_accounts?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
